server {
  listen 80;
  server_name lorebase.duckdns.org;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name lorebase.duckdns.org;

  ssl_certificate     /etc/letsencrypt/live/lorebase.duckdns.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/lorebase.duckdns.org/privkey.pem;

  resolver 127.0.0.11 valid=10s;

  set $backend  http://backend:8080;
  set $frontend http://frontend:3000;

  location = /api/debug-token {
    return 404;
  }

  location /api/ {
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location = /actuator/health {
    proxy_pass $backend;
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass $frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}