services:
  backend:
    image: ${ECR_REGISTRY}/wiki-backend:${IMAGE_TAG}
    env_file: .env
    environment:                                         # ← add these two lines
      - EMBEDDING_API_URL=http://embeddings:80/embed
    restart: unless-stopped
  embeddings:                                            # ← add this whole block
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8.1
    command: ["--model-id", "BAAI/bge-small-en-v1.5","--max-batch-tokens", "2048",
              "--max-client-batch-size", "4",
              "--tokenization-workers", "1"]
    volumes:
      - tei-data:/data
    restart: unless-stopped
  frontend:
    image: ${ECR_REGISTRY}/wiki-frontend:${IMAGE_TAG}
    environment:
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
volumes:                                                 # ← add at the very end of the file
  tei-data: