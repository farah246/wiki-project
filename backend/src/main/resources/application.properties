# Database Configuration with Environment Variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Same behaviour as before locally; override in production with DDL_AUTO=validate (or none)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}

# HikariCP Configuration (optional but recommended)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

huggingface.api.token=${HF_API_TOKEN}

# Clerk: the default is your current dev instance; override with CLERK_ISSUER_URI when you switch to production keys
spring.security.oauth2.resourceserver.jwt.issuer-uri=${CLERK_ISSUER_URI:https://maximum-fish-1436.clerk.accounts.dev}
clerk.secret-key=${CLERK_SECRET_KEY}

# CORS: comma-separated list of allowed frontend origins (default = local dev)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Health endpoint for Docker / AWS checks (only "health" is exposed)
management.endpoints.web.exposure.include=health

# Behind Nginx (HTTPS termination): trust X-Forwarded-* headers
server.forward-headers-strategy=framework

embedding.api.url=${EMBEDDING_API_URL:https://router.huggingface.co/hf-inference/models/BAAI/bge-small-en-v1.5}

# ---- Ask the wiki (RAG) ----
# Any OpenAI-compatible chat endpoint. Default: Hugging Face router, same token as the embeddings.
llm.api.url=${LLM_API_URL:https://router.huggingface.co/v1/chat/completions}
llm.api.key=${LLM_API_KEY:${huggingface.api.token:}}
# Check the model is currently served by an Inference Provider before relying on this default
llm.model=${LLM_MODEL:meta-llama/Llama-3.3-70B-Instruct}
llm.max-tokens=${LLM_MAX_TOKENS:1500}
# How many chunks go into the prompt, and the minimum cosine similarity to be used at all
rag.top-k=6
rag.min-similarity=0.5
