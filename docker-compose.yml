# Local development: runs the backend and the frontend together.
# Run from the wiki-project folder (next to backend/ and frontend/):
#   docker compose --env-file frontend/.env up --build
#
# - Backend settings come from .env.api (DB_URL, DB_USERNAME, DB_PASSWORD, HF_API_TOKEN, CLERK_SECRET_KEY)
# - Clerk keys for the frontend come from frontend/.env via --env-file

services:
  api:
    build: ./backend
    image: my-api
    env_file: .env.api
    ports:
      - "8080:8080"

  web:
    build:
      context: ./frontend
      args:
        # Baked into the frontend at build time.
        # host.docker.internal = your PC, reachable from the browser AND from inside the container.
        NEXT_PUBLIC_API_URL: http://host.docker.internal:8080
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    image: my-web
    environment:
      # Secret: passed at runtime only, never baked into the image
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
    ports:
      - "3000:3000"
    depends_on:
      - api