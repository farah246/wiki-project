name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: eu-north-1
  INSTANCE_ID: i-0f5e2483d9c0a2797
  SERVER_URL: http://13.63.43.238

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        env:
          REG: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -t $REG/wiki-backend:${{ github.sha }} -t $REG/wiki-backend:latest ./backend
          docker push --all-tags $REG/wiki-backend

      - name: Build and push frontend
        env:
          REG: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ env.SERVER_URL }} \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }} \
            -t $REG/wiki-frontend:${{ github.sha }} -t $REG/wiki-frontend:latest ./frontend
          docker push --all-tags $REG/wiki-frontend

      - name: Deploy via SSM
        env:
          REG: ${{ steps.ecr.outputs.registry }}
        run: |
          COMPOSE_B64=$(base64 -w0 deploy/docker-compose.prod.yml)
          NGINX_B64=$(base64 -w0 deploy/nginx.conf)

          PARAMS=$(jq -n \
            --arg reg "$REG" --arg tag "${{ github.sha }}" --arg region "$AWS_REGION" \
            --arg compose "$COMPOSE_B64" --arg nginx "$NGINX_B64" '{commands: [
            "set -e",
            "cd /opt/wiki",
            "cp -f docker-compose.prod.yml docker-compose.prod.yml.prev || true",
            "cp -f nginx.conf nginx.conf.prev || true",
            ("echo " + $compose + " | base64 -d > docker-compose.prod.yml"),
            ("echo " + $nginx + " | base64 -d > nginx.conf"),
            ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $reg),
            ("export ECR_REGISTRY=" + $reg + " IMAGE_TAG=" + $tag),
            "docker compose -f docker-compose.prod.yml config -q",
            "docker compose -f docker-compose.prod.yml pull",
            "docker compose -f docker-compose.prod.yml up -d --remove-orphans",
            "docker exec wiki-nginx-1 nginx -t",
            "docker exec wiki-nginx-1 nginx -s reload",
            "docker image prune -f"
          ]}')

          CMD_ID=$(aws ssm send-command --instance-ids $INSTANCE_ID \
            --document-name AWS-RunShellScript --parameters "$PARAMS" \
            --query Command.CommandId --output text)

          aws ssm wait command-executed --command-id $CMD_ID --instance-id $INSTANCE_ID || true
          STATUS=$(aws ssm get-command-invocation --command-id $CMD_ID --instance-id $INSTANCE_ID --query Status --output text)
          aws ssm get-command-invocation --command-id $CMD_ID --instance-id $INSTANCE_ID --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id $CMD_ID --instance-id $INSTANCE_ID --query StandardErrorContent --output text
          [ "$STATUS" = "Success" ] || exit 1

      - name: Verify
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' $SERVER_URL/ || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          exit 1
