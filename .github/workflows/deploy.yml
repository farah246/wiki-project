name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/**'
      - '.trivyignore'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: eu-north-1
  INSTANCE_ID: i-0f5e2483d9c0a2797
  SERVER_URL: https://lorebase.duckdns.org
jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-backend:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3
      - name: Build backend (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/wiki-backend:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/wiki-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Scan backend image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/wiki-backend:${{ github.sha }}
        run: |
          docker save "$IMAGE" -o backend.tar
          docker run --rm -v "$PWD:/scan" ghcr.io/aquasecurity/trivy:0.69.2 \
            image --input /scan/backend.tar --ignorefile /scan/.trivyignore \
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

      - name: Push backend
        env:
          REG: ${{ steps.ecr.outputs.registry }}
        run: docker push --all-tags $REG/wiki-backend

  build-frontend:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3


      - name: Build frontend (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.SERVER_URL }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/wiki-frontend:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/wiki-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Scan frontend image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/wiki-frontend:${{ github.sha }}
        run: |
          docker save "$IMAGE" -o frontend.tar
          docker run --rm -v "$PWD:/scan" ghcr.io/aquasecurity/trivy:0.69.2 \
            image --input /scan/frontend.tar \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

      - name: Push frontend
        env:
          REG: ${{ steps.ecr.outputs.registry }}
        run: docker push --all-tags $REG/wiki-frontend


  deploy:
    needs: [ci, build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ env.SERVER_URL }}
    # NEW
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2



      - name: Deploy via SSM
        env:
          REG: ${{ steps.ecr.outputs.registry }}
        run: |
          COMPOSE_B64=$(base64 -w0 deploy/docker-compose.prod.yml)
          NGINX_B64=$(base64 -w0 deploy/nginx.conf)
          LOADENV_B64=$(base64 -w0 deploy/load-env.sh)

          PARAMS=$(jq -n \
            --arg reg "$REG" --arg tag "${{ github.sha }}" --arg region "$AWS_REGION" \
            --arg compose "$COMPOSE_B64" --arg nginx "$NGINX_B64" \
            --arg loadenv "$LOADENV_B64" '{commands: [
            "set -e",
            "cd /opt/wiki",
            "cp -f docker-compose.prod.yml docker-compose.prod.yml.prev || true",
            "cp -f nginx.conf nginx.conf.prev || true",
            ("echo " + $compose + " | base64 -d > docker-compose.prod.yml"),
            ("echo " + $nginx + " | base64 -d > nginx.conf"),
            ("echo " + $loadenv + " | base64 -d > load-env.sh"),
            "chmod 700 load-env.sh",
            ("./load-env.sh " + $region),
            ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $reg),
            ("export ECR_REGISTRY=" + $reg + " IMAGE_TAG=" + $tag),
            "docker compose -f docker-compose.prod.yml config -q",
            "docker compose -f docker-compose.prod.yml pull",
            "docker compose -f docker-compose.prod.yml up -d --remove-orphans",
            "docker exec wiki-nginx-1 nginx -t",
            "docker exec wiki-nginx-1 nginx -s reload",
            "docker image prune -f"
          ]}')

          CMD_ID=$(aws ssm send-command --instance-ids $INSTANCE_ID \
            --document-name AWS-RunShellScript --parameters "$PARAMS" \
            --query Command.CommandId --output text)

          aws ssm wait command-executed --command-id $CMD_ID --instance-id $INSTANCE_ID || true
          STATUS=$(aws ssm get-command-invocation --command-id $CMD_ID --instance-id $INSTANCE_ID --query Status --output text)
          aws ssm get-command-invocation --command-id $CMD_ID --instance-id $INSTANCE_ID --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id $CMD_ID --instance-id $INSTANCE_ID --query StandardErrorContent --output text
          [ "$STATUS" = "Success" ] || exit 1

      - name: Verify
        id: verify
        run: |
          check() {
            for i in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$1" || true)
              echo "$1 attempt $i: HTTP $code (expected $2)"
              [ "$code" = "$2" ] && return 0
              sleep 10
            done
            return 1
          }
          check "$SERVER_URL/" 200
          check "$SERVER_URL/api/procedures" 401 

      - name: Save last good tag
        env:
          TAG: ${{ github.sha }}
        run: |
          PARAMS=$(jq -n --arg tag "$TAG" \
            '{commands: [("echo " + $tag + " > /opt/wiki/.last_good_tag")]}')

          CMD_ID=$(aws ssm send-command --instance-ids $INSTANCE_ID \
            --document-name AWS-RunShellScript --parameters "$PARAMS" \
            --query Command.CommandId --output text)

          aws ssm wait command-executed --command-id $CMD_ID --instance-id $INSTANCE_ID || true
          STATUS=$(aws ssm get-command-invocation --command-id $CMD_ID --instance-id $INSTANCE_ID --query Status --output text)
          echo "Save last good tag: $STATUS"
          [ "$STATUS" = "Success" ] || exit 1
          

      - name: Rollback to last good version
        if: failure() && steps.verify.outcome != 'success'
        env:
          REG: ${{ steps.ecr.outputs.registry }}
        run: |
          PARAMS=$(jq -n --arg reg "$REG" --arg region "$AWS_REGION" '{commands: [
            "cd /opt/wiki",
            "if [ ! -s .last_good_tag ]; then echo \"Pas de .last_good_tag : rollback impossible\"; exit 1; fi",
            "export IMAGE_TAG=$(cat .last_good_tag)",
            ("export ECR_REGISTRY=" + $reg),
            "echo \"Rollback vers $IMAGE_TAG\"",
            "docker compose -f docker-compose.prod.yml up -d --remove-orphans",
            "docker exec wiki-nginx-1 nginx -t",
            "docker exec wiki-nginx-1 nginx -s reload"
          ]}')

          CMD_ID=$(aws ssm send-command --instance-ids $INSTANCE_ID \
            --document-name AWS-RunShellScript --parameters "$PARAMS" \
            --query Command.CommandId --output text)

          aws ssm wait command-executed --command-id $CMD_ID --instance-id $INSTANCE_ID || true
          STATUS=$(aws ssm get-command-invocation --command-id $CMD_ID --instance-id $INSTANCE_ID --query Status --output text)
          aws ssm get-command-invocation --command-id $CMD_ID --instance-id $INSTANCE_ID --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id $CMD_ID --instance-id $INSTANCE_ID --query StandardErrorContent --output text
          echo "Rollback: $STATUS"
          [ "$STATUS" = "Success" ] || { echo "::error::Le rollback a échoué (statut $STATUS)"; exit 1; }
          


  notify:
    needs: [ ci,build-backend, build-frontend, deploy ]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          MSG="❌ Deploy pipeline failed on \`${SHA:0:7}\` (pushed by $ACTOR)
          $RUN_URL"
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "$(jq -n --arg content "$MSG" '{content: $content}')" \
            "$WEBHOOK"