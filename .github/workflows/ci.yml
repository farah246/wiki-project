name: CI

on:
  pull_request:
  push:
    branches-ignore: [ main ]
  workflow_call:   # lets deploy.yml run these checks first

permissions:
  contents: read

# NEW: one group per branch; a newer push cancels the older run (PRs only)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15          # NEW
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and run tests
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10          # NEW
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # Not blocking yet: make it blocking (remove continue-on-error)
      # once the existing code base lints clean.
      - name: Lint
        run: npx eslint .
        continue-on-error: true